<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>센서 통계</title>
  <script>
    (function () {
      var theme = localStorage.getItem("sensor-theme") || "white";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=28">
  <link rel="stylesheet" href="/static/theme.css?v=14">
  <style>
    /* 기본 레이아웃 */
    .dash-note { color: #64748b; margin: 0 0 12px; }
    .board { display: grid; gap: 20px; padding: 20px; box-sizing: border-box; min-width: 0; }
    /* 하단 MAC / RMS / PEAK : 3열 */
    .channel { display: grid; grid-template-columns: 180px repeat(2, minmax(0, 1fr)); gap: 16px; align-items: center; width: 100%; min-width: 0; box-sizing: border-box; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; border-radius: 10px; transition: box-shadow 0.8s ease, background-color 0.8s ease; }
    .channel > .mac { grid-column: 1; grid-row: 1; min-width: 0; }
    .channel > div:nth-child(2) { grid-column: 2; grid-row: 1; min-width: 0; width: 100%; }
    .channel > div:nth-child(3) { grid-column: 3; grid-row: 1; min-width: 0; width: 100%; }
    /* MAC 정보 */
    .mac { font-weight: 800; word-break: break-all; }
    .mac small { display: block; font-weight: 500; color: #64748b; }
    /* 그래프 텍스트 */
    .metric-title { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .metric-value { font-variant-numeric: tabular-nums; font-size: 13px; margin-top: 4px; }
    /* 기존 가로 막대 스타일 (다른 곳에서 사용한다면 유지) */
    .track { position: relative; height: 22px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; background: #1f77b4; }
    .fill.warn { background: #d97706; }
    .fill.over { background: #dc2626; }
    .limit-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #b45309; }
    /* RMS / PEAK 선 그래프 */
    .spark { position: relative; width: 100%; height: 110px; min-width: 0; }
    .spark canvas { display: block; width: 100% !important; height: 100% !important; }
    /* 최근 센서 측정값 */
    .metric-latest { font-size: 12px; margin-top: 2px; color: #3e5164; font-variant-numeric: tabular-nums; }
    .metric-latest b.warn { color: #b45309; }
    .metric-latest b.over { color: #dc2626; }
    /* 선택 센서 강조 */
    .channel.focus { box-shadow: 0 0 0 2px #dc2626, 0 0 0 8px rgba(220, 38, 38, 0.15); background-color: rgba(220, 38, 38, 0.05); }
    html[data-theme="dark"] .channel.focus { background-color: rgba(220, 38, 38, 0.12); }
    html[data-theme="dark"] .metric-latest { color: #b5b5b5; }
    /* 상단 초음파 / 진동 막대그래프 : 1.5 : 2.5 */
    .srss-chart-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 2.5fr); gap: 16px; width: 100%; grid-column: 1 / -1; }
    .srss-chart-layout.single { grid-template-columns: minmax(0, 1fr); }
    .srss-chart { min-width: 0; padding: 16px; border: 1px solid #dee2e6; border-radius: 8px; }
    .srss-chart-container { position: relative; width: 100%; height: 300px; }
    /* 반응형 */
    @media (max-width: 900px) {
      .channel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .channel > .mac { grid-column: 1 / -1; grid-row: 1; }
      .channel > div:nth-child(2) { grid-column: 1; grid-row: 2; }
      .channel > div:nth-child(3) { grid-column: 2; grid-row: 2; }
    }
    @media (max-width: 768px) {
      .srss-chart-layout { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
<header>
  <strong class="brand">센서 통계</strong>
  <nav>
    <a href="/">센서 현황</a>
    <a href="/receiver">센서 수신 모니터</a>
    <a href="/generator">데이터 분석 CSV</a>
    <a href="/studio">센서 데이터 분석</a>
    <a class="active" href="/dashboard">통계</a>
    <a href="/settings">설정</a>
  </nav>
</header>
<main>
  <section class="card">
    <h2>MAC별 통계</h2>
    <p class="dash-note" id="updatedNote">통계는 매일 자정 뒤 자동으로 계산됩니다.</p>
    <div class="board" id="board"></div>
  </section>
</main>
<script src="/static/chart.umd.min.js"></script>
<script>
  /*
   * 통계 화면. 서버가 이미 만든 measurement 값만 읽어 그린다. 이 화면에서는 계산하지 않는다.
   * - 페이지를 열 때 /api/db/dashboard를 한 번 읽어 그린다. 반복 조회는 하지 않는다.
   *   measurement는 하루 한 번(자정 뒤) 서버 스케줄러가 계산할 때만 바뀐다. 그 사이에는 값이 그대로다.
   *   열어 둔 동안 스케줄러가 돌았으면 페이지를 다시 열 때 반영된다.
   * - 화면에서 계산을 시키는 버튼은 없다. 사람마다 다른 시각에 최신화하면 보는 값의 기준 시각이
   *   서로 달라져 혼란스럽기 때문이다(2026-11-18 결정). 모두 같은 '마지막 계산 시각'을 본다.
   */
  const board = document.querySelector("#board");
  const charts = [];

  /* 숫자면 소수 digits자리 글자, 아니면 "-". */
  function num(value, digits) {
    const number = Number(value);
    return Number.isFinite(number) ? number.toFixed(digits) : "-";
  }

  /* 마지막 계산 시각 "YYYY-MM-DD HH:MM". 없으면 null. 보는 사람 모두에게 같은 글자가 보이게 서버 값을 그대로 자른다. */
  function stampText(updatedAt) {
    const text = String(updatedAt || "").replace("T", " ").slice(0, 16);
    return text.length === 16 ? text : null;
  }

  /*
   * paint가 만든 canvas마다 작은 꺾은선(RMS, PEAK 구간 변화)을 그린다.
   * 값은 canvas의 data-values, data-labels에 JSON으로 들어 있다.
   * 다시 그릴 때마다 이전 Chart 객체를 destroy해서 메모리에 쌓이지 않게 한다.
   */
  function drawCharts() {
    charts.splice(0).forEach((chart) => chart.destroy());
    board.querySelectorAll("canvas").forEach((canvas) => {
      const values = JSON.parse(canvas.dataset.values || "[]").map(Number);
      const labels = JSON.parse(canvas.dataset.labels || "[]");
      charts.push(new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: values,
            borderColor: canvas.dataset.color,
            borderWidth: 1.5,
            pointRadius: values.length > 1 ? 2 : 3,
            tension: 0.15,
            fill: false,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: {
              ticks: { maxTicksLimit: 4, font: { size: 9 }, color: document.documentElement.getAttribute("data-theme") === "white" ? "#64748b" : "#9aa8b5" },
              grid: { display: false },
            },
            y: {
              ticks: { maxTicksLimit: 3, font: { size: 10 }, color: document.documentElement.getAttribute("data-theme") === "white" ? "#64748b" : "#9aa8b5" },
              grid: { color: document.documentElement.getAttribute("data-theme") === "dark" ? "rgba(170, 200, 170, 0.16)" : "#e2e8f0" },
            },
          },
        },
      }));
    });
  }

  function drawBar(canvasId, data) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const labels = data.map(item => item.display_name || item.mac);

    const values = data.map(item => {
      if (item.srss_mms == null) return null;

      const value = Number(item.srss_mms);
      return Number.isFinite(value) ? value : null;
    });

    const limits = data.map(item => Number(item.limit) || 4.5);

    const colors = values.map((value, i) => {
      if (value === null) return "#94A3B8"; // 데이터 없음
      const ratio = value / limits[i];
      if (ratio <= 0.25) return "#34B983"; // 초록
      if (ratio <= 0.50) return "#4299E1"; // 파랑
      if (ratio <= 0.75) return "#F2C44E"; // 노랑
      return "#EF6868";                    // 빨강
    });

    const existingChart = Chart.getChart(canvas);

    if (existingChart) {
      existingChart.destroy();

      const index = charts.indexOf(existingChart);
      if (index !== -1) {
        charts.splice(index, 1);
      }
    }

    charts.push(new Chart(canvas, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "SRSS 전체 평균",
          data: values,
          backgroundColor: colors,
          borderRadius: 3,
          categoryPercentage: 0.8,
          barPercentage: 0.9,
          // maxBarThickness: 40
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: contexts => contexts[0].label,
              label: context => {
                const value = context.raw;
                return value == null
                        ? "통계 없음"
                        : `SRSS: ${Number(value).toFixed(3)} mm/s`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { display: true,
              autoSkip: false,
              maxRotation: 45,
              minRotation: 0,
              font: {
                size: 12,
                weight: "bold"
              },
              color: "#1c2833"

            },
            grid: { display: false }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: "mm/s RMS"
            }
          }
        }
      }
    }));
  }

  function drawSrssChart(items) {
    const layout = document.getElementById("srssChartLayout");
    if (!layout) return;

    // 1. 센서 종류별 분류
    const ultrasonicItems = items.filter(item =>
            String(item.last_sensor || "").toUpperCase() === "ULTRASONIC"
    );

    const vibrationItems = items.filter(item =>
            ["ADXL", "PIEZO"].includes(
                    String(item.last_sensor || "").toUpperCase()
            )
    );

    // 2. 그룹 정보 정의
    const groups = [
      // {
      //     id: "ultrasonicBarChart",
      //     title: "초음파",
      //     items: ultrasonicItems
      // },
      {
        id: "vibrationBarChart",
        title: "진동",
        items: vibrationItems
      }
    ].filter(group => group.items.length > 0);

    // 실제 표시되는 그룹 수에 따라 레이아웃 변경
    layout.classList.toggle("single", groups.length === 1);

    // 3. 그룹별 HTML 생성
    layout.innerHTML = groups.map(group => `
                <section class="srss-chart">
                    <h3>${group.title}</h3>
                    <div class="srss-chart-container">
                        <canvas id="${group.id}"></canvas>
                    </div>
                </section>
            `).join("");

    // 4. 그룹별 Chart.js 그래프 생성
    groups.forEach(group => {
      drawBar(group.id, group.items);
    });
  }


  /*
   * MAC마다 한 줄을 만든다.
   * - SRSS 막대: 구간 줄을 세트 수로 가중한 전체 평균(mm/s RMS). 눈금 끝은 모든 MAC의 SRSS·한계·4.5 중 가장 큰 값의 1.15배라
   *   MAC끼리 같은 눈금으로 비교된다.
   *   한계 이상이면 over, 한계의 80% 이상이면 warn 색이다. 세로 표시는 SRSS 한계 위치다.
   * - RMS, PEAK: 숫자는 전체 평균과 최댓값, 작은 그래프는 최근 구간 최대 40개.
   */
  function paint(data) {
    const items = data.items || [];
    const stamp = stampText(data.updated_at);
    document.querySelector("#updatedNote").textContent = (stamp === null
                    ? "아직 계산된 통계가 없습니다. "
                    : `마지막 계산 ${stamp}. `) +
            "통계는 매일 자정 뒤 자동으로 계산됩니다. 막대는 전체 평균, '최근'은 가장 최근 통계(센서 현황 경보 기준)이고, 그래프는 구간별 변화입니다.";
    if (!items.length) {
      board.innerHTML = "<p>등록된 MAC이 없습니다.</p>";
      return;
    }
    const srssValues = items.map((item) => Number(item.srss_mms) || 0);
    const limits = items.map((item) => Number(item.limit) || 4.5);
    const scale = Math.max(4.5, ...srssValues, ...limits, 0.001) * 1.15;

    // MAC별 SRSS 전체 평균을 세로 막대그래프로 생성
    // MAC 주소 목록
    // const srssLabels = JSON.stringify(items.map(item => item.mac));
    const srssChart = `<div id="srssChartLayout" class="srss-chart-layout"></div>`;

    board.innerHTML = srssChart + items.map((item) => {
      const value = Number(item.srss_mms);
      const limit = Number(item.limit) || 4.5;
      const width = Number.isFinite(value) ? Math.min(100, (value / scale) * 100) : 0;
      const mark = Math.min(100, (limit / scale) * 100);
      const level = !Number.isFinite(value) ? "" : value >= limit ? "over" : value >= limit * 0.8 ? "warn" : "";
      const series = item.series || [];
      const previewSeries = series.slice(-24); // 그래프 용
      const labels = JSON.stringify(previewSeries.map((point) => String(point.t || "").slice(5, 16)));
      const rms = JSON.stringify(previewSeries.map((point) => point.rms));
      const peak = JSON.stringify(previewSeries.map((point) => point.peak));
      const name = item.display_name ? `${item.display_name}` : "";
      const sets = Number(item.set_count) || 0;
      const range = sets ? `전체 ${sets}세트 · 구간 ${series.length}개` : "통계 전";
      // 최근 줄(센서 현황의 경보 판정 값). 한계 이상 over, 80% 이상 warn.
      const latest = Number(item.latest_srss_mms);
      const latestLevel = !Number.isFinite(latest) ? "" : latest >= limit ? "over" : latest >= limit * 0.8 ? "warn" : "";
      const latestText = Number.isFinite(latest) && Number(item.set_count) > 0
              ? `<div class="metric-latest">최근 ${String(item.latest_at || "").slice(5, 10)} <b class="${latestLevel}">${num(latest, 3)}</b>${latestLevel === "over" ? " · 한계 초과" : latestLevel === "warn" ? " · 주의" : ""}</div>`
              : "";
      return `<div>
                        <div class="channel" data-mac="${item.mac}" >
                          <div class="mac">${name}<small>${item.mac}</small><small>${range}</small></div>
                          <div>
                            <div class="metric-title">RMS 평균 ${num(item.rms, 4)} g</div>
                            <div class="spark"><canvas data-color="#1f77b4" data-values='${rms}' data-labels='${labels}'></canvas></div>
                          </div>
                          <div>
                            <div class="metric-title">PEAK 최대 ${num(item.peak, 4)} g</div>
                            <div class="spark"><canvas data-color="#d62728" data-values='${peak}' data-labels='${labels}'></canvas></div>
                          </div>
                        </div>
                    </div>`;
    }).join("");
    drawCharts();
    drawSrssChart(items);
    focusMac();
  }

  /* 저장된 통계를 읽어 그린다. 최신화는 하지 않는다. */
  /*
   * 센서 현황 카드의 '통계에서 확인'·'통계 보기'는 주소(GET ?mac=)에 MAC을 남기지 않는다.
   * 누를 때 sessionStorage('dashboard-focus')에 MAC을 넣고, 여기서 한 번 읽자마자 지운다.
   * (POST로 페이지를 열면 새로고침·뒤로 가기 때 '양식 다시 제출' 경고가 떠서 이 방법을 쓴다.)
   * 그 줄을 화면 가운데로 옮기고 약 5초 강조한 뒤 서서히 풀린다. 새로고침하면 다시 강조되지 않는다.
   */
  let focusTarget = null;
  try {
    focusTarget = sessionStorage.getItem("dashboard-focus");
    sessionStorage.removeItem("dashboard-focus");
  } catch (error) {
    focusTarget = null;
  }
  function focusMac() {
    if (!focusTarget) return;
    const row = [...board.querySelectorAll(".channel")].find((node) => node.dataset.mac === focusTarget);
    focusTarget = null; // 한 번만(테마를 바꿔 다시 그릴 때는 하지 않음)
    if (!row) return;
    row.scrollIntoView({ block: "center" });
    row.classList.add("focus");
    setTimeout(() => row.classList.remove("focus"), 5000);
  }
  let lastData = null;
  async function load() {
    const data = await (await fetch("/api/db/dashboard")).json();
    lastData = data;
    console.log("==data", data);
    paint(data);
  }
  // 헤더에서 테마를 바꾸면(새로고침 없음, theme.js) 작은 그래프 눈금 색을 새 테마로 다시 그린다.
  window.addEventListener("sensor-theme", () => {
    if (lastData) paint(lastData);
  });

  load().catch((error) => alert(error.message));
</script>
<script src="/static/theme.js?v=4"></script>
</body>
</html>
