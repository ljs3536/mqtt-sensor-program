<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>센서 통계</title>
    <script>
      (function () {
        var theme = localStorage.getItem("sensor-theme") || "white";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/static/style.css?v=32" />
    <link rel="stylesheet" href="/static/theme.css?v=14" />
    <style>
      .dash-note {
        color: #64748b;
        margin: 0 0 12px;
      }
      .board {
        display: grid;
        gap: 14px;
      }
      .channel {
        display: grid;
        grid-template-columns:
          180px minmax(220px, 1.4fr) minmax(160px, 1fr)
          minmax(160px, 1fr);
        gap: 12px;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
      }
      /* 왼쪽 칸(2026-11-24): 이름을 크게, 그 아래 위치, MAC·종류·기간 세트 수는 작게. 이름이 없으면 MAC이 제목이 된다. */
      .mac {
        word-break: break-all;
      }
      .mac .name {
        display: block;
        font-size: 15px;
        font-weight: 800;
        color: #1c2833;
        line-height: 1.25;
      }
      .mac .place {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #1f6aa5;
        margin-top: 2px;
      }
      .mac small {
        display: block;
        font-weight: 500;
        color: #64748b;
        margin-top: 2px;
      }
      .mac .kind {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 0 6px;
        border-radius: 4px;
        background: #e2e8f0;
        color: #334155;
        margin-left: 4px;
        vertical-align: 2px;
      }
      html[data-theme="dark"] .mac .name {
        color: #ededed;
      }
      html[data-theme="dark"] .mac .place {
        color: #f0a05a;
      }
      html[data-theme="dark"] .mac .kind {
        background: #333;
        color: #d4d4d4;
      }
      html[data-theme="gray"] .mac .place {
        color: #c45c12;
      }
      /* 기간 고르기(2026-11-24): 24시간(기본) · 7일 · 30일 · 전체 */
      .dash-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        margin-bottom: 6px;
      }
      .dash-head h2 {
        margin: 0;
      }
      .period {
        display: inline-flex;
        gap: 4px;
        background: #e7eef5;
        border-radius: 8px;
        padding: 3px;
      }
      .period button {
        background: transparent;
        color: #234055;
        box-shadow: none;
        height: 30px;
        padding: 0 14px;
        font-weight: 700;
      }
      .period button.active {
        background: white;
        color: #1e3348;
        box-shadow: 0 1px 2px rgba(20, 40, 60, 0.12);
      }
      html[data-theme="dark"] .period {
        background: #262626;
      }
      html[data-theme="dark"] .period button {
        color: #a3a3a3;
      }
      html[data-theme="dark"] .period button.active {
        background: #3a3a3a;
        color: #f0a05a;
      }
      html[data-theme="gray"] .period button.active {
        color: #c45c12;
      }
      .metric-title {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .track {
        position: relative;
        height: 22px;
        background: #e2e8f0;
        border-radius: 6px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: #1f77b4;
      }
      /* 진동 네 구간(2026-11-23, ISO 20816-3 Group 2 강성 지지): 센서 현황과 같은 색 */
      .fill.good {
        background: #16a34a;
      }
      .fill.caution {
        background: #a3a01c;
      }
      .fill.warn {
        background: #f97316;
      }
      .fill.over {
        background: #dc2626;
      }
      .limit-mark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #b45309;
      }
      /* 양호·주의 상한 위치(가는 점선) */
      .zone-mark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 1px dashed rgba(100, 116, 139, 0.8);
      }
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        margin-top: 4px;
      }
      .spark {
        height: 72px;
        position: relative;
      }
      /* 최근 줄 값(센서 현황의 경보 판정과 같은 값) */
      .metric-latest {
        font-size: 12px;
        margin-top: 2px;
        color: #3e5164;
        font-variant-numeric: tabular-nums;
      }
      .metric-latest b.good {
        color: #15803d;
      }
      .metric-latest b.caution {
        color: #7a7810;
      }
      .metric-latest b.warn {
        color: #c2410c;
      }
      .metric-latest b.over {
        color: #dc2626;
      }
      /* 센서 현황에서 넘어왔을 때 그 줄을 약 5초 강조했다가 서서히 없앤다 */
      .channel {
        border-radius: 10px;
        transition:
          box-shadow 0.8s ease,
          background-color 0.8s ease;
      }
      .channel.focus {
        box-shadow:
          0 0 0 2px #dc2626,
          0 0 0 8px rgba(220, 38, 38, 0.15);
        background-color: rgba(220, 38, 38, 0.05);
      }
      html[data-theme="dark"] .channel.focus {
        background-color: rgba(220, 38, 38, 0.12);
      }
      html[data-theme="dark"] .metric-latest {
        color: #b5b5b5;
      }
      .spark canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      @media (max-width: 900px) {
        .channel {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong class="brand">센서 통계</strong>
      <nav>
        <a href="/">센서 현황</a>
        <a href="/receiver">센서 수신 모니터</a>
        <a href="/generator">데이터 분석 CSV</a>
        <a href="/studio">센서 데이터 분석</a>
        <a class="active" href="/dashboard">통계</a>
        <a href="/settings">설정</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <div class="dash-head">
          <h2>센서별 통계</h2>
          <div class="period" id="period" role="tablist" aria-label="기간">
            <button type="button" data-period="24h">24시간</button>
            <button type="button" data-period="7d">7일</button>
            <button type="button" data-period="30d">30일</button>
            <button type="button" data-period="all">전체</button>
          </div>
        </div>
        <p class="dash-note" id="updatedNote">
          통계는 매시 정각 뒤 자동으로 계산됩니다.
        </p>
        <div class="board" id="board"></div>
      </section>
    </main>
    <script src="/static/chart.umd.min.js"></script>
    <script>
      /*
       * 통계 화면. 서버가 이미 만든 measurement 값만 읽어 그린다. 이 화면에서는 계산하지 않는다.
       * - 페이지를 열 때 /api/db/dashboard?period=를 한 번 읽어 그린다. 반복 조회는 하지 않는다.
       *   기간 버튼(24시간 기본·7일·30일·전체, 2026-11-24)을 누르면 그 기간으로 다시 읽는다. 고른 기간은
       *   localStorage('dashboard-period')에 기억한다. 막대·RMS 평균·PEAK 최대·그래프가 모두 그 기간 값이다.
       *   그래프 점은 24시간은 한 시간, 7일·30일·전체는 하루(서버가 묶음, 7일은 7점).
       * - 초음파 센서는 이 화면에 보이지 않는다(아직 이상 판정 기준이 없어 통계를 계산하지 않음, 2026-11-24).
       *   measurement는 매시 정각 뒤 서버 스케줄러가 계산할 때만 바뀐다(2026-11-23, 전에는 하루 한 번).
       *   한 줄 = MAC 하나의 한 시간(그 시간 세트들의 평균). 열어 둔 동안 스케줄러가 돌았으면 다시 열 때 반영된다.
       * - 계산 기준은 설정 > 통계 데이터 > '통계 계산 기준'의 지금 버전이다(안내 줄에 요약이 보인다).
       * - 화면에서 계산을 시키는 버튼은 없다. 사람마다 다른 시각에 최신화하면 보는 값의 기준 시각이
       *   서로 달라져 혼란스럽기 때문이다(2026-11-18 결정). 모두 같은 '마지막 계산 시각'을 본다.
       */
      const board = document.querySelector("#board");
      const charts = [];

      /* 사람이 넣은 글자(이름·위치)를 HTML에 그대로 넣지 않게 바꾼다. */
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (ch) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }

      /* 숫자면 소수 digits자리 글자, 아니면 "-". */
      function num(value, digits) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(digits) : "-";
      }

      /* 마지막 계산 시각 "YYYY-MM-DD HH:MM". 없으면 null. 보는 사람 모두에게 같은 글자가 보이게 서버 값을 그대로 자른다. */
      function stampText(updatedAt) {
        const text = String(updatedAt || "")
          .replace("T", " ")
          .slice(0, 16);
        return text.length === 16 ? text : null;
      }

      /*
       * paint가 만든 canvas마다 작은 꺾은선(RMS, PEAK 구간 변화)을 그린다.
       * 값은 canvas의 data-values, data-labels에 JSON으로 들어 있다.
       * 다시 그릴 때마다 이전 Chart 객체를 destroy해서 메모리에 쌓이지 않게 한다.
       */
      function drawCharts() {
        charts.splice(0).forEach((chart) => chart.destroy());
        board.querySelectorAll("canvas").forEach((canvas) => {
          const values = JSON.parse(canvas.dataset.values || "[]").map(Number);
          const labels = JSON.parse(canvas.dataset.labels || "[]");
          charts.push(
            new Chart(canvas, {
              type: "line",
              data: {
                labels,
                datasets: [
                  {
                    data: values,
                    borderColor: canvas.dataset.color,
                    borderWidth: 1.5,
                    pointRadius: values.length > 1 ? 2 : 3,
                    tension: 0.15,
                    fill: false,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                  legend: { display: false },
                  tooltip: { enabled: true },
                },
                scales: {
                  x: {
                    ticks: {
                      maxTicksLimit: 4,
                      font: { size: 9 },
                      color:
                        document.documentElement.getAttribute("data-theme") ===
                        "white"
                          ? "#64748b"
                          : "#9aa8b5",
                    },
                    grid: { display: false },
                  },
                  y: {
                    ticks: {
                      maxTicksLimit: 3,
                      font: { size: 10 },
                      color:
                        document.documentElement.getAttribute("data-theme") ===
                        "white"
                          ? "#64748b"
                          : "#9aa8b5",
                    },
                    grid: {
                      color:
                        document.documentElement.getAttribute("data-theme") ===
                        "dark"
                          ? "rgba(170, 200, 170, 0.16)"
                          : "#e2e8f0",
                    },
                  },
                },
              },
            }),
          );
        });
      }

      /*
       * MAC마다 한 줄을 만든다.
       * - SRSS 막대: 구간 줄을 세트 수로 가중한 전체 평균(mm/s RMS). 눈금 끝은 모든 MAC의 SRSS·한계·4.5 중 가장 큰 값의 1.15배라
       *   MAC끼리 같은 눈금으로 비교된다.
       *   색은 진동 네 구간(양호·주의·경고·위험, MAC마다 설정 > 장치의 경계 item.zones)이다(2026-11-23).
       *   굵은 세로선은 위험 기준, 점선 두 개는 양호·주의 상한 위치다.
       * - RMS, PEAK: 숫자는 고른 기간의 평균과 최댓값, 작은 그래프는 그 기간의 변화.
       */
      function paint(data) {
        const items = data.items || [];
        const stamp = stampText(data.updated_at);
        const profile = data.profile || {};
        const basis = profile.id
          ? `계산 기준 v${profile.id}: ${profile.summary}. `
          : `계산 기준: ${profile.summary || "-"}. `;
        document.querySelector("#updatedNote").textContent =
          (stamp === null
            ? "아직 계산된 통계가 없습니다. "
            : `마지막 계산 ${stamp}. `) +
          basis +
          `통계는 매시 정각 뒤 자동으로 계산됩니다. 막대·숫자는 ${PERIOD_TEXT[data.period] || "고른 기간"} 평균(PEAK는 최대), ` +
          `'최근'은 가장 최근 한 시간(센서 현황 경보 기준, 기간과 상관없음)이고, 그래프는 ${data.bucket === "day" ? "하루" : "시간"}별 변화입니다.`;
        if (!items.length) {
          board.innerHTML = "<p>통계를 볼 진동 센서가 없습니다.</p>";
          return;
        }
        // PIEZO(2026-11-23): 한 축이라 SRSS 대신 그 축 Vrms. 값이 MEMS보다 수십 배 클 수 있어 공통 눈금에서 빼고
        // 자기 값·위험 기준 중 큰 값 기준 눈금으로 그린다.
        // 2026-11-24: PIEZO도 설정 > 장치의 진동 구간(양호·주의 상한, 위험 기준)으로 막대 색·구간선·판정 글자를 보인다.
        //   (센서 현황 평면도 판정은 아직 MEMS만: site_status.JUDGED_KINDS. 환산 확정 뒤 거기에 PIEZO를 더한다.)
        const isPiezo = (item) => item.sensor_type === "PIEZO";
        const mems = items.filter((item) => !isPiezo(item));
        const srssValues = mems.map((item) => Number(item.srss_mms) || 0);
        const limits = mems.map((item) => Number(item.limit) || 4.5);
        // 진동 구간(서버 limits.zone_of와 같은 경계 규칙): 경계값은 위 구간(1.4는 주의, 4.5는 위험).
        const zoneOf = (value, zones) =>
          !Number.isFinite(value)
            ? ""
            : value >= zones.limit
              ? "over"
              : value >= zones.caution
                ? "warn"
                : value >= zones.good
                  ? "caution"
                  : "good";
        const ZONE_NAME = {
          good: "양호",
          caution: "주의",
          warn: "경고",
          over: "위험",
        };
        const scale = Math.max(4.5, ...srssValues, ...limits, 0.001) * 1.15;
        board.innerHTML = items
          .map((item) => {
            // 통계가 없는 MAC은 값이 null이다. Number(null)=0이 '0.000 · 양호'로 보이지 않게 NaN으로 둔다.
            const value =
              Number(item.set_count) > 0 && item.srss_mms != null
                ? Number(item.srss_mms)
                : NaN;
            const limit = Number(item.limit) || 4.5;
            const zones = item.zones || {
              good: (limit * 1.4) / 4.5,
              caution: (limit * 2.8) / 4.5,
              limit,
            };
            const piezo = isPiezo(item);
            // 눈금 끝: MEMS는 공통 눈금, PIEZO는 자기 값과 위험 기준 중 큰 값의 1.15배(구간선이 항상 막대 안에 보이게)
            const ownScale = piezo
              ? Math.max(Number.isFinite(value) ? value : 0, limit, 0.001) *
                1.15
              : scale;
            const width = Number.isFinite(value)
              ? Math.min(100, (value / ownScale) * 100)
              : 0;
            const mark = Math.min(100, (limit / ownScale) * 100);
            const goodMark = Math.min(100, (zones.good / ownScale) * 100);
            const cautionMark = Math.min(100, (zones.caution / ownScale) * 100);
            const level = zoneOf(value, zones);
            const series = item.series || [];
            // 시간 줄 키 '2026-11-23T14:00:00' → '11-23 14시', 하루 점 '2026-11-23' → '11-23'. 옛 하루 통계는 '11-23 09:41'처럼 그대로.
            const labels = JSON.stringify(
              series.map((point) => {
                const text = String(point.t || "");
                if (text.length === 10) return text.slice(5);
                return text.endsWith(":00:00")
                  ? `${text.slice(5, 10)} ${text.slice(11, 13)}시`
                  : text.slice(5, 16).replace("T", " ");
              }),
            );
            const rms = JSON.stringify(series.map((point) => point.rms));
            const peak = JSON.stringify(series.map((point) => point.peak));
            // 이름이 제목. 없으면 MAC이 제목이고 아래 MAC 줄은 생략한다. 위치는 설정 > 장치 '위치' 칸(device.location).
            const title = esc(item.display_name || item.mac);
            const place = item.location
              ? `<span class="place">${esc(item.location)}</span>`
              : "";
            const macLine = item.display_name
              ? `<small>${esc(item.mac)}</small>`
              : "";
            const sets = Number(item.set_count) || 0;
            const unit = data.bucket === "day" ? "일" : "시간";
            const range = sets
              ? `${PERIOD_TEXT[data.period] || ""} ${sets}세트 · ${series.length}${unit}`
              : item.has_stats
                ? "이 기간 통계 없음"
                : "통계 전";
            // 최근 줄(센서 현황의 경보 판정 값). 한계 이상 over, 80% 이상 warn.
            const latest = Number(item.latest_srss_mms);
            const latestLevel = zoneOf(latest, zones);
            const latestText =
              Number.isFinite(latest) && Number(item.set_count) > 0
                ? `<div class="metric-latest">최근 ${String(
                    item.latest_at || "",
                  )
                    .slice(5, 16)
                    .replace(
                      "T",
                      " ",
                    )} <b class="${latestLevel}">${num(latest, 3)}</b>${latestLevel ? ` · ${ZONE_NAME[latestLevel]}` : ""}</div>`
                : "";
            return `<div class="channel" data-mac="${item.mac}">
          <div class="mac"><span class="name">${title}${piezo ? '<span class="kind">PIEZO</span>' : ""}</span>${place}${macLine}<small>${range}</small></div>
          <div>
            <div class="metric-title">${piezo ? "PIEZO Vrms" : "SRSS"} ${PERIOD_TEXT[data.period] || ""} 평균 mm/s RMS</div>
            <div class="track" title="양호 &lt; ${num(zones.good, 2)} ≤ 주의 &lt; ${num(zones.caution, 2)} ≤ 경고 &lt; ${num(limit, 2)} ≤ 위험 (mm/s)${piezo ? "&#10;PIEZO: 눈금은 이 MAC 값 기준, 환산(Vmax/Amax/감도·게인) 확인 전 값" : ""}"><div class="fill ${level}" style="width:${width}%"></div><div class="zone-mark" style="left:${goodMark}%"></div><div class="zone-mark" style="left:${cautionMark}%"></div><div class="limit-mark" style="left:${mark}%"></div></div>
            <div class="metric-value">${num(value, 3)} / ${limit}${level ? ` · ${ZONE_NAME[level]}` : ""}</div>
            ${latestText}
          </div>
          <div>
            <div class="metric-title">RMS ${PERIOD_TEXT[data.period] || ""} 평균 ${num(item.rms, 4)} g</div>
            <div class="spark"><canvas data-color="#1f77b4" data-values='${rms}' data-labels='${labels}'></canvas></div>
          </div>
          <div>
            <div class="metric-title">PEAK ${PERIOD_TEXT[data.period] || ""} 최대 ${num(item.peak, 4)} g</div>
            <div class="spark"><canvas data-color="#d62728" data-values='${peak}' data-labels='${labels}'></canvas></div>
          </div>
        </div>`;
          })
          .join("");
        drawCharts();
        focusMac();
      }

      /* 저장된 통계를 읽어 그린다. 최신화는 하지 않는다. */
      /*
       * 센서 현황 카드의 '통계에서 확인'·'통계 보기'는 주소(GET ?mac=)에 MAC을 남기지 않는다.
       * 누를 때 sessionStorage('dashboard-focus')에 MAC을 넣고, 여기서 한 번 읽자마자 지운다.
       * (POST로 페이지를 열면 새로고침·뒤로 가기 때 '양식 다시 제출' 경고가 떠서 이 방법을 쓴다.)
       * 그 줄을 화면 가운데로 옮기고 약 5초 강조한 뒤 서서히 풀린다. 새로고침하면 다시 강조되지 않는다.
       */
      let focusTarget = null;
      try {
        focusTarget = sessionStorage.getItem("dashboard-focus");
        sessionStorage.removeItem("dashboard-focus");
      } catch (error) {
        focusTarget = null;
      }
      function focusMac() {
        if (!focusTarget) return;
        const row = [...board.querySelectorAll(".channel")].find(
          (node) => node.dataset.mac === focusTarget,
        );
        focusTarget = null; // 한 번만(테마를 바꿔 다시 그릴 때는 하지 않음)
        if (!row) return;
        row.scrollIntoView({ block: "center" });
        row.classList.add("focus");
        setTimeout(() => row.classList.remove("focus"), 5000);
      }
      let lastData = null;
      // 기간(서버 store.DASHBOARD_PERIODS와 같은 키). 고른 값은 이 브라우저에만 기억한다.
      const PERIOD_TEXT = {
        "24h": "24시간",
        "7d": "7일",
        "30d": "30일",
        all: "전체",
      };
      let period = "24h";
      try {
        const saved = localStorage.getItem("dashboard-period");
        if (PERIOD_TEXT[saved]) period = saved;
      } catch (error) {
        /* 저장소를 못 쓰면 기본 24시간 */
      }
      function markPeriod() {
        document
          .querySelectorAll("#period button")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.period === period),
          );
      }
      document.querySelectorAll("#period button").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.period === period) return;
          period = button.dataset.period;
          try {
            localStorage.setItem("dashboard-period", period);
          } catch (error) {
            /* 기억만 못 할 뿐 */
          }
          markPeriod();
          load().catch((error) => alert(error.message));
        });
      });
      markPeriod();
      async function load() {
        const data = await (
          await fetch(`/api/db/dashboard?period=${encodeURIComponent(period)}`)
        ).json();
        lastData = data;
        paint(data);
      }
      // 헤더에서 테마를 바꾸면(새로고침 없음, theme.js) 작은 그래프 눈금 색을 새 테마로 다시 그린다.
      window.addEventListener("sensor-theme", () => {
        if (lastData) paint(lastData);
      });

      load().catch((error) => alert(error.message));
    </script>
    <script src="/static/theme.js?v=4"></script>
  </body>
</html>
