<!--
  분석 화면 설정 서랍. /generator(데이터 분석 CSV)와 /studio(센서 데이터 분석)가 같이 쓴다.
  routes/pages.py가 페이지를 보낼 때, 페이지 안의 include 표시 주석 자리에 이 파일을 넣는다.
  화면별 차이(전송 체크·Topic 숨김 등)는 HTML이 아니라 studio.js가 불러온 뒤에 처리한다.
  id는 generator-*.js, studio.js, db.js가 찾으므로 바꿀 때 스크립트도 같이 본다.
-->
<aside class="studio-settings hidden-drawer" id="settings">
  <div class="drawer-tools">
    <button type="button" class="icon-btn" id="menuMode" title="메뉴로 두기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 7h16M4 12h16M4 17h16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="pinMode" title="왼쪽에 고정">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle
          cx="12"
          cy="7"
          r="3"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />
        <path
          d="M12 10v11"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <button type="button" class="icon-btn" id="pinClose" title="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M6 6l12 12M18 6L6 18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
  <div class="tabs" id="drawerTabs">
    <button type="button" data-tab="settings" class="active">설정</button>
    <button type="button" data-tab="transmit">전송</button>
  </div>
  <div id="settingsTab" class="tab-page active">
    <h2 id="settingsTitle">PIEZO 설정</h2>
    <div id="analysis">
      <!-- FFT·PSD·시간 이력·FFT 검증 공통 칸. 초음파(스펙트럼만)는 모두 쓰지 않아 /studio에서 숨긴다(studio.js, 2026-11-25). -->
      <div class="stack" id="commonBox">
        <!-- 발생기 v073 'Linear Averaging'과 같은 기능: 평균 개수만큼 패킷 FFT를 주파수 칸별로 더해 M으로 나눈다(graph_curves._average). -->
        <div class="pair">
          <label class="check"
            ><input id="fftAvg" type="checkbox" /><span>FFT 평균</span></label
          >
          <label
            >평균 개수
            <select id="fftAvgCount">
              <option>2</option>
              <option>4</option>
              <option>8</option>
              <option selected>16</option>
              <option>32</option>
              <option>64</option>
              <option>128</option>
              <option>전체</option>
            </select>
          </label>
        </div>
        <div class="pair">
          <label class="check"
            ><input id="fftLogX" type="checkbox" /><span
              >FFT X 로그</span
            ></label
          >
          <label class="check"
            ><input id="fftLogY" type="checkbox" /><span
              >FFT Y 로그</span
            ></label
          >
        </div>
        <!--
                PSD(Welch, 발생기 v070). 켜면 FFT 그래프 자리에 PSD 밀도(단위²/Hz)를 그린다.
                PSD가 켜져 있으면 FFT 평균은 하지 않고, 위 'FFT 평균 (Linear Averaging)'·평균 개수는 PSD에 넣을
                패킷 범위로만 쓴다(꺼져 있으면 선택 패킷 하나). 계산은 서버 graph_psd.py.
              -->
        <div class="psd-box">
          <label class="check"
            ><input id="psdOn" type="checkbox" /><span>PSD (Welch)</span></label
          >
          <div class="pair">
            <label
              >PSD 구간 N
              <select id="psdSegment">
                <option selected>전체</option>
                <option>8192</option>
                <option>4096</option>
                <option>2048</option>
                <option>1024</option>
                <option>512</option>
                <option>256</option>
                <option>128</option>
              </select>
            </label>
            <label
              >Overlap (%)
              <select id="psdOverlap">
                <option>0</option>
                <option>25</option>
                <option selected>50</option>
                <option>75</option>
              </select>
            </label>
          </div>
          <label
            >PSD 평균 목표 구간<input
              id="psdTarget"
              value="30"
              inputmode="numeric"
          /></label>
          <p class="field-note">
            예: N=8192, 구간=512, Overlap=50% → 패킷당 31구간 중 목표 30구간
            사용. PSD일 때 'FFT 평균 (Linear Averaging)'과 평균 개수는 PSD에
            넣을 패킷 범위입니다.
          </p>
          <!-- MEMS: X/Y/Z 세트마다, PIEZO: 패킷마다 PSD로 속도 RMS를 구해 수신 시각 순서로 그린다(velocity-history.js).
               글자는 지금 센서에 맞춰 바뀌고, 초음파면 숨는다. -->
          <button type="button" class="secondary" id="velocityHistory">
            X/Y/Z 속도 RMS 시간 이력
          </button>
        </div>
        <button type="button" class="secondary" id="fftCheck">
          FFT 과정 / IFFT 검증
        </button>
      </div>
      <fieldset id="piezoBox">
        <legend>PIEZO</legend>
        <div class="stack">
          <!-- PIEZO 표시 단위: MEMS처럼 RAW·FFT 따로(2026-11-25, 전에는 한 칸 piezoUnit). 기본 자동 가속도. 축 이름 "PIEZO 단위". -->
          <label
            >RAW 단위
            <select id="piezoRaw">
              <option value="자동 (g/mg/µg)" selected>자동 가속도 (g/mg/µg)</option>
              <option value="Count">ADC (Count)</option>
              <option value="mV">전압 (mV)</option>
              <option value="g">가속도 (g)</option>
              <option value="mg">가속도 (mg)</option>
              <option value="µg">가속도 (µg)</option>
            </select>
          </label>
          <label
            >FFT 단위
            <select id="piezoFft">
              <option value="자동 (g RMS)" selected>자동 가속도 (g RMS)</option>
              <option value="Count Peak">ADC (Count Peak)</option>
              <option value="mV Peak">전압 (mV Peak)</option>
              <option value="g Peak">가속도 (g Peak)</option>
              <option value="g RMS">가속도 (g RMS)</option>
              <option value="mm/s RMS">속도 (mm/s RMS)</option>
            </select>
          </label>
          <div class="pair">
            <label>Vmax (V)<input id="piezoVmax" value="3.89" /></label>
            <label>Amax<input id="piezoAmax" value="4096" /></label>
          </div>
          <div class="pair">
            <label>감도 (mV/g)<input id="piezoSens" value="100" /></label>
            <label
              >FFT 창
              <select id="piezoWindow">
                <option selected>Blackman</option>
                <option>Hann</option>
                <option>Hamming</option>
                <option>Rectangular</option>
              </select>
            </label>
          </div>
          <!-- Window 보정: FFT 진폭을 무엇으로 나눌지. 옆 글자는 실제 곱해진 보정계수(서버 계산). -->
          <label
            >Window 보정
            <select id="piezoWindowCorrection">
              <option>보정 없음</option>
              <option selected>진폭 보정</option>
              <option>에너지 보정</option>
            </select>
            <span id="piezoWindowFactor" class="field-note window-factor"
              >보정계수: 데이터 대기</span
            >
          </label>
          <label
            >Window N
            <select id="piezoN">
              <option>전체</option>
              <option>1024</option>
              <option>2048</option>
              <option>4096</option>
              <option>8192</option>
            </select>
          </label>
          <div id="piezoFilters"></div>
        </div>
      </fieldset>
      <fieldset id="adxlBox" hidden>
        <legend>MEMS</legend>
        <div class="stack">
          <div class="checks">
            <label class="check"
              ><input id="axisX" type="checkbox" checked /><span>X</span></label
            >
            <label class="check"
              ><input id="axisY" type="checkbox" checked /><span>Y</span></label
            >
            <label class="check"
              ><input id="axisZ" type="checkbox" checked /><span>Z</span></label
            >
            <label class="check"
              ><input id="gnOn" type="checkbox" checked /><span>gN</span></label
            >
            <label class="check"
              ><input id="srssOn" type="checkbox" checked /><span
                >SRSS</span
              ></label
            >
          </div>
          <div class="pair">
            <label>한계값 (mm/s RMS)<input id="srssLimit" value="4.5" /></label>
            <button type="button" class="secondary" id="applySrssLimit">
              한계값 적용
            </button>
          </div>
          <label
            >RAW 단위
            <select id="adxlRaw">
              <option value="자동 (g/mg/µg)">자동 가속도 (g/mg/µg)</option>
              <option value="Count">ADC (Count)</option>
              <option value="g">가속도 (g)</option>
              <option value="mg">가속도 (mg)</option>
              <option value="µg">가속도 (µg)</option>
            </select>
          </label>
          <label
            >FFT 단위
            <select id="adxlFft">
              <option value="자동 (g RMS)">자동 가속도 (g RMS)</option>
              <option value="Count Peak">ADC (Count Peak)</option>
              <option value="g Peak">가속도 (g Peak)</option>
              <option value="g RMS">가속도 (g RMS)</option>
              <option value="mm/s RMS">속도 (mm/s RMS)</option>
            </select>
          </label>
          <p id="adxlFftHint" class="hint"></p>
          <div class="pair">
            <label>1 LSB = (g)<input id="adxlG" value="0.00390625" /></label>
            <button type="button" class="secondary" id="saveG">LSB 저장</button>
          </div>
          <div class="pair">
            <label
              >FFT Window
              <select id="adxlWindow">
                <option>Rectangular</option>
                <option>Hann</option>
                <option>Hamming</option>
                <option selected>Blackman</option>
                <option>Blackman-Harris</option>
                <option>Flat Top</option>
                <option>Bartlett</option>
                <option>Kaiser</option>
              </select>
            </label>
            <label
              >Window N
              <select id="adxlN">
                <option>전체</option>
                <option>1024</option>
                <option>2048</option>
                <option>4096</option>
                <option>8192</option>
              </select>
            </label>
          </div>
          <div class="pair">
            <label>Kaiser β<input id="adxlBeta" value="8.6" /></label>
            <label
              >Window 보정
              <select id="adxlWindowCorrection">
                <option>보정 없음</option>
                <option selected>진폭 보정</option>
                <option>에너지 보정</option>
              </select>
            </label>
          </div>
          <p id="adxlWindowFactor" class="field-note window-factor">
            보정계수: 데이터 대기
          </p>
          <div id="adxlFilters"></div>
          <div class="pair">
            <label class="check"
              ><input id="freqOn" type="checkbox" checked /><span
                >주파수 보정 ON</span
              ></label
            >
            <label>f 나눗수<input id="freqDiv" value="1.014" /></label>
          </div>
          <label class="check"
            ><input id="sensOn" type="checkbox" checked /><span
              >Sensitivity 보정 ON</span
            ></label
          >
          <div class="pair">
            <label>저주파 경계 Hz<input id="lowHz" value="60" /></label>
            <label>고주파 경계 Hz<input id="highHz" value="360" /></label>
          </div>
          <div class="pair">
            <label>저주파 S<input id="lowS" value="0.99" /></label>
            <label>중간 상수<input id="midA" value="1.07" /></label>
          </div>
          <div class="pair">
            <label>중간 기울기<input id="midB" value="0.0005" /></label>
            <label>고주파 S<input id="highS" value="0.89" /></label>
          </div>
          <button type="button" class="secondary" id="saveCorrection">
            보정 적용/저장
          </button>
        </div>
      </fieldset>
      <div id="ultraBox" hidden>
        <p class="hint">
          초음파 H는 320점 스펙트럼만 표시합니다. RAW/FFT 설정은 쓰지 않습니다.
        </p>
      </div>
    </div>
  </div>
  <div id="transmitTab" class="tab-page">
    <div class="stack">
      <div class="pair">
        <label>IP<input id="host" value="127.0.0.1" /></label>
        <label>Port<input id="port" value="1883" /></label>
      </div>
      <div class="pair">
        <label>QoS<input id="qos" value="1" /></label>
        <label>Device ID<input id="device" value="S01" /></label>
      </div>
      <label>MAC<input id="mac" value="TEST00000001" /></label>
      <label class="check"
        ><input id="rewrite" type="checkbox" /><span>MAC 덮어쓰기</span></label
      >
      <label class="check"
        ><input id="seq" type="checkbox" checked /><span
          >진동 seq 자동</span
        ></label
      >
      <label class="check"
        ><input id="jitterOn" type="checkbox" /><span>Jitter</span></label
      >
      <label class="check"
        ><input id="lossOn" type="checkbox" /><span>패킷 손실</span></label
      >
      <label>ADXL XYZ gap(ms)<input id="xyzGap" value="5" /></label>
      <label>초음파 tick 증가<input id="tickStep" value="0" /></label>
      <button type="button" class="secondary" id="testBroker">
        연결 테스트
      </button>
      <button type="button" class="go" id="start">
        선택 위치부터 전송 시작
      </button>
      <button type="button" class="stop" id="stop">중지</button>
      <p id="stats" class="hint">Publish 0 / PUBACK 0 / Drop 0</p>
      <div id="sensors"></div>
      <div class="between">
        <h2>송신 로그</h2>
        <button type="button" class="secondary" id="clearLog">
          로그 지우기
        </button>
      </div>
      <p class="hint">최근 200줄만 남습니다.</p>
      <pre id="log"></pre>
    </div>
  </div>
</aside>
