<!DOCTYPE html>
<!--
  대문: 센서 현황. 평면도 이미지 위에 센서 아이콘을 놓고 연결·수신·알람을 보여 준다.
  - 평면도는 여러 장(층·구역마다 한 장)이고 위쪽 탭으로 고른다. 탭에는 그 평면도의 문제(끊김·알람) 수가 붙는다.
    평면도 한 장에는 센서를 여러 개 놓고, 센서 하나는 평면도 한 장에만 놓는다.
  - 보기 모드: /api/site/status 를 15초마다 읽어 아이콘 색과 목록을 갱신한다(브라우저 탭이 안 보이면 멈춤).
  - 편집 모드: 평면도 추가·이미지 교체·이름 바꾸기·순서·삭제, 목록에서 끌어 놓기, 아이콘 이동·빼기, 저장/취소.
  판정 규칙은 서버 site_status.py, 화면 동작은 static/site.js, 모양은 static/site.css.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>센서 현황</title>
  <script>
  (function () {
    var theme = localStorage.getItem("sensor-theme") || "white";
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=23">
  <link rel="stylesheet" href="/static/theme.css?v=11">
  <link rel="stylesheet" href="/static/site.css?v=2">
</head>
<body class="site-page">
  <header>
    <strong class="brand">센서 현황</strong>
    <nav>
      <a class="active" href="/">센서 현황</a>
      <a href="/receiver">센서 수신 모니터</a>
      <a href="/generator">데이터 분석 CSV</a>
      <a href="/studio">센서 데이터 분석</a>
      <a href="/dashboard">통계</a>
      <a href="/settings">설정</a>
    </nav>
  </header>
  <main class="site-main">
    <!-- 요약 줄: 수신 연결 상태, 상태별 개수(누르면 그 상태 아이콘만 강조), 갱신 시각, 편집 -->
    <section class="card site-summary">
      <div class="site-receiver">
        <span id="receiverPill" class="pill off">수신 확인 중</span>
        <span id="receiverText" class="hint"></span>
      </div>
      <div id="countChips" class="site-counts"></div>
      <div class="site-tools">
        <span id="refreshText" class="hint"></span>
        <button type="button" class="secondary" id="refreshNow">새로고침</button>
        <button type="button" id="editToggle">배치 편집</button>
      </div>
    </section>

    <!-- 편집 도구: 편집 모드에서만 보인다 -->
    <section id="editBar" class="card site-editbar" hidden>
      <strong>배치 편집</strong>
      <!-- 같은 파일 선택창 하나를 '추가'와 '교체'가 같이 쓴다(site.js의 fileMode). -->
      <input id="planFile" type="file" accept=".png,.jpg,.jpeg,.webp,.svg,image/png,image/jpeg,image/webp,image/svg+xml" hidden>
      <button type="button" id="planAdd">평면도 추가</button>
      <span class="site-plan-tools" id="planTools">
        <button type="button" class="secondary" id="planReplace">이미지 교체</button>
        <button type="button" class="secondary" id="planRename">이름 바꾸기</button>
        <button type="button" class="secondary" id="planLeft" title="탭을 앞으로">◀</button>
        <button type="button" class="secondary" id="planRight" title="탭을 뒤로">▶</button>
        <button type="button" class="stop" id="planDelete">이 평면도 삭제</button>
      </span>
      <span class="hint">오른쪽 목록의 센서를 지금 평면도로 끌어 놓고, 아이콘을 끌어 옮깁니다. ×는 평면도에서 빼기. 다른 평면도에 있던 센서를 놓으면 이쪽으로 옮겨집니다.</span>
      <span class="site-edit-actions">
        <span id="dirtyText" class="hint"></span>
        <button type="button" class="secondary" id="editCancel">취소</button>
        <button type="button" class="go" id="editSave">저장</button>
      </span>
    </section>

    <div class="site-layout">
      <!-- 평면도 -->
      <section class="card site-plan-card">
        <!-- 평면도 탭: 이름 + 그 평면도 위 문제 센서 수(끊김·지연 / 알람 초과·주의) -->
        <div id="planTabs" class="site-tabs" role="tablist" hidden></div>
        <div id="planEmpty" class="site-empty" hidden>
          <p><strong>평면도가 없습니다.</strong></p>
          <p class="hint">위 '배치 편집' → '평면도 추가'로 PNG·JPG·WEBP·SVG 이미지를 올리면 센서를 배치할 수 있습니다. 층·구역마다 한 장씩 여러 장 둘 수 있습니다.</p>
        </div>
        <div id="planWrap" class="site-plan-wrap" hidden>
          <div id="planStage" class="site-plan-stage">
            <img id="planImage" alt="평면도" draggable="false">
            <div id="markerLayer" class="site-markers"></div>
          </div>
        </div>
      </section>

      <!-- 센서 목록: 평면도에 없는 센서도 여기서 상태를 본다. 편집 모드에서는 끌어 놓기 출발점. -->
      <aside class="card site-list-card">
        <div class="site-list-head">
          <h2>센서 <small id="listCount"></small></h2>
          <select id="listFilter" aria-label="목록 보기">
            <option value="all">전체</option>
            <option value="here">이 평면도</option>
            <option value="unplaced">배치 안 됨</option>
            <option value="problem">문제 있음</option>
          </select>
        </div>
        <ul id="sensorList" class="site-list"></ul>
      </aside>
    </div>

    <!-- 아이콘을 누르면 뜨는 정보 카드 -->
    <div id="sensorCard" class="site-card" hidden></div>
    <p class="hint site-rule" id="ruleText"></p>
  </main>
  <script src="/static/api.js?v=1"></script>
  <script src="/static/site.js?v=3"></script>
  <script src="/static/theme.js?v=3"></script>
</body>
</html>
