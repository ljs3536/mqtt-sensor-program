<!DOCTYPE html>
<!--
  대문: 센서 현황(보기 전용). 평면도 위 아이콘 색 하나로 센서 상태를 본다.
  - 상태는 다섯 가지: 경보(빨강) > 끊김(진회색) > 주의(주황) > 정상(초록) > 대기(연회색). 판정은 서버 site_status.py.
  - 위 타일을 누르면 그 상태 센서만 강조·목록에 남는다. 아이콘이나 목록을 누르면 정보 카드.
  - 평면도 추가·배치는 설정 화면 '평면도 배치' 탭(/settings#plan). 이 화면에서는 바꾸지 않는다.
  화면 동작은 static/site.js(data-site-mode="view"), 모양은 static/site.css.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>센서 현황</title>
  <script>
  (function () {
    var theme = localStorage.getItem("sensor-theme") || "white";
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=26">
  <link rel="stylesheet" href="/static/theme.css?v=12">
  <link rel="stylesheet" href="/static/site.css?v=4">
</head>
<body class="site-page" data-site-mode="view">
  <header>
    <strong class="brand">센서 현황</strong>
    <nav>
      <a class="active" href="/">센서 현황</a>
      <a href="/receiver">센서 수신 모니터</a>
      <a href="/generator">데이터 분석 CSV</a>
      <a href="/studio">센서 데이터 분석</a>
      <a href="/dashboard">통계</a>
      <a href="/settings">설정</a>
    </nav>
  </header>
  <main class="site-main">
    <!-- 상태 타일: 상태별 센서 수. 누르면 그 상태만 강조 -->
    <section class="site-top">
      <div id="statusTiles" class="status-tiles"></div>
      <div class="site-meta">
        <span id="liveDot" class="live-dot" title="수신 확인 중"></span>
        <span id="refreshText" class="hint"></span>
        <button type="button" class="icon-btn" id="refreshNow" title="지금 새로고침" aria-label="새로고침">↻</button>
        <a class="icon-btn" href="/settings#plan" title="평면도·센서 배치 편집(설정)" aria-label="배치 편집">⚙</a>
      </div>
    </section>
    <!-- 수신이 꺼져 있을 때만 보이는 안내 -->
    <div id="receiverBanner" class="site-banner" hidden></div>

    <div class="site-layout">
      <section class="card site-plan-card">
        <div id="planTabs" class="site-tabs" role="tablist" hidden></div>
        <div id="planEmpty" class="site-empty" hidden>
          <p><strong>평면도가 없습니다.</strong></p>
          <p class="hint"><a href="/settings#plan">설정 → 평면도 배치</a>에서 평면도를 올리고 센서를 놓으면 여기에 보입니다.</p>
        </div>
        <div id="planWrap" class="site-plan-wrap" hidden>
          <div id="planStage" class="site-plan-stage">
            <img id="planImage" alt="평면도" draggable="false">
            <div id="markerLayer" class="site-markers"></div>
          </div>
        </div>
        <!-- 색 범례. ⓘ에 마우스를 올리면 판정 기준 -->
        <div class="site-legend">
          <span class="state-alarm"><i></i>경보</span>
          <span class="state-lost"><i></i>끊김</span>
          <span class="state-warn"><i></i>주의</span>
          <span class="state-ok"><i></i>정상</span>
          <span class="state-idle"><i></i>대기</span>
          <span id="legendInfo" class="legend-info" tabindex="0">ⓘ 판정 기준</span>
        </div>
      </section>

      <aside class="card site-list-card">
        <div class="site-list-head"><h2>센서 <small id="listCount"></small></h2></div>
        <ul id="sensorList" class="site-list"></ul>
      </aside>
    </div>

    <div id="sensorCard" class="site-card" hidden></div>
  </main>
  <script src="/static/api.js?v=1"></script>
  <script src="/static/site.js?v=6"></script>
  <script src="/static/theme.js?v=4"></script>
</body>
</html>
