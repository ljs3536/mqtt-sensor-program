<!DOCTYPE html>
<!--
  대문: 센서 현황(보기 전용). 평면도 위 아이콘 색 하나로 센서 상태를 본다.
  - 상태는 여섯 가지: 위험(빨강) > 미수신(진회색) > 경보(주황) > 지연(노랑) > 정상(초록) > 확인 불가(연회색). 판정은 서버 site_status.py.
  - 위 타일을 누르면 그 상태 센서만 강조·목록에 남는다. 아이콘이나 목록을 누르면 정보 카드.
  - 평면도 추가·배치는 설정 화면 '평면도 배치' 탭(/settings#plan). 이 화면에서는 바꾸지 않는다.
  화면 동작은 static/site.js(data-site-mode="view"), 모양은 static/site.css.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>센서 현황</title>
  <script>
  (function () {
    var theme = localStorage.getItem("sensor-theme") || "white";
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=32">
  <link rel="stylesheet" href="/static/theme.css?v=14">
  <link rel="stylesheet" href="/static/site.css?v=13">
</head>
<body class="site-page" data-site-mode="view">
  <header>
    <strong class="brand">센서 현황</strong>
    <nav>
      <a class="active" href="/">센서 현황</a>
      <a href="/receiver">센서 수신 모니터</a>
      <a href="/generator">데이터 분석 CSV</a>
      <a href="/studio">센서 데이터 분석</a>
      <a href="/dashboard">통계</a>
      <a href="/settings">설정</a>
    </nav>
  </header>
  <main class="site-main">
    <!-- 위쪽 요약: 진동 / 초음파 묶음마다 총 개수, 상태(경보·위험), 수신(정상·이상·확인 불가). 숫자를 누르면 그 조건만 강조 -->
    <section class="site-top">
      <div id="statusTiles" class="status-tiles"></div>
      <div class="site-meta">
        <span id="liveDot" class="live-dot" title="수신 확인 중"></span>
        <span id="refreshText" class="hint"></span>
        <button type="button" class="icon-btn" id="refreshNow" title="지금 새로고침" aria-label="새로고침">↻</button>
        <a class="icon-btn" href="/settings#plan" title="평면도·센서 배치 편집(설정)" aria-label="배치 편집">⚙</a>
        <!-- 오른쪽 센서 목록 숨기기/펴기(상태는 브라우저에 기억) -->
        <button type="button" class="icon-btn list-toggle" id="listToggle" aria-pressed="true" title="센서 목록 숨기기" aria-label="센서 목록 숨기기/보이기">☰</button>
      </div>
    </section>
    <!-- 수신이 꺼져 있을 때만 보이는 안내 -->
    <div id="receiverBanner" class="site-banner" hidden></div>

    <div class="site-layout">
      <section class="card site-plan-card">
        <div id="planTabs" class="site-tabs" role="tablist" hidden></div>
        <div id="planEmpty" class="site-empty" hidden>
          <p><strong>평면도가 없습니다.</strong></p>
          <p class="hint"><a href="/settings#plan">설정 → 평면도 배치</a>에서 평면도를 올리고 센서를 놓으면 여기에 보입니다.</p>
        </div>
        <div id="planWrap" class="site-plan-wrap" hidden>
          <!-- 확대·이동: 휠 = 확대/축소, 빈 곳 끌기 = 이동(확대했을 때), 버튼 = + − 맞춤 -->
          <div class="zoom-tools">
            <button type="button" id="zoomIn" title="확대" aria-label="확대">+</button>
            <span id="zoomText">100%</span>
            <button type="button" id="zoomOut" title="축소" aria-label="축소">−</button>
            <button type="button" id="zoomFit" title="전체 보기" aria-label="전체 보기">⤢</button>
          </div>
          <div id="planStage" class="site-plan-stage">
            <img id="planImage" alt="평면도" draggable="false">
            <div id="markerLayer" class="site-markers"></div>
          </div>
        </div>
        <!-- 색 범례. ⓘ에 마우스를 올리면 판정 기준 -->
        <!-- 범례: 상태 색, ! = 배터리 부족, 종류 기호(Type1/2/3). site.js paintLegend가 앞에 채운다 -->
        <div class="site-legend" id="siteLegend">
          <span id="legendInfo" class="legend-info" tabindex="0">ⓘ 판정 기준</span>
        </div>
      </section>

      <aside class="card site-list-card">
        <!-- 센서 목록 / 최근 알림(상태 변화 기록). 알림 탭 배지 = 확인하지 않은 위험·미수신·경보·지연 수 -->
        <div class="site-list-head list-tabs">
          <button type="button" class="active" data-list-tab="sensors">센서 <small id="listCount"></small></button>
          <button type="button" data-list-tab="events">최근 알림 <span id="eventBadge" class="event-badge" hidden></span></button>
          <button type="button" class="list-close" id="listClose" title="센서 목록 숨기기" aria-label="센서 목록 숨기기">»</button>
        </div>
        <input id="listSearch" class="list-search" type="search" placeholder="이름·MAC 검색" aria-label="센서 검색">
        <ul id="sensorList" class="site-list"></ul>
        <!-- 알림 도구: 모두 확인, 확인한 것도 보기(알림 탭에서만 보인다) -->
        <div id="eventTools" class="event-tools" hidden>
          <label class="check"><input id="showAcked" type="checkbox"><span>확인한 것도 보기</span></label>
          <button type="button" class="secondary" id="ackAll">모두 확인</button>
        </div>
        <ul id="eventList" class="site-list event-list" hidden></ul>
      </aside>
    </div>

    <div id="sensorCard" class="site-card" hidden></div>
  </main>
  <script src="/static/api.js?v=1"></script>
  <script src="/static/site.js?v=22"></script>
  <script src="/static/theme.js?v=4"></script>
</body>
</html>
