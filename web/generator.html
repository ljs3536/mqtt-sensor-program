<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>MQTT 파형 발생기</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <strong>sensor-program</strong>
    <nav>
      <a href="/">센서 수신 모니터</a>
      <a class="active" href="/generator">MQTT 파형 발생기</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <div class="row">
        <label>Broker IP<input id="host" value="127.0.0.1"></label>
        <label>Port<input id="port" value="1883" style="width:80px"></label>
        <label>QoS<input id="qos" value="1" style="width:50px"></label>
        <label>User<input id="user"></label>
        <label>Password<input id="password" type="password"></label>
        <label>Device ID<input id="device" value="S01"></label>
        <label>MAC<input id="mac" value="TEST00000001"></label>
        <label><span>MAC 덮어쓰기</span><input id="rewrite" type="checkbox"></label>
        <label><span>진동 seq 자동</span><input id="seq" type="checkbox" checked></label>
        <label><span>Jitter</span><input id="jitterOn" type="checkbox"></label>
        <label><span>패킷 손실</span><input id="lossOn" type="checkbox"></label>
      </div>
    </section>
    <section class="card" id="sensors"></section>
    <section class="card">
      <div class="row">
        <strong>ADXL CSV 3개 (기존 JSON/JSONL 선택도 유지)</strong>
        <label>X<input id="adxlX" type="file" accept=".csv,text/csv"></label>
        <label>Y<input id="adxlY" type="file" accept=".csv,text/csv"></label>
        <label>Z<input id="adxlZ" type="file" accept=".csv,text/csv"></label>
        <button type="button" id="loadAdxlCsv">XYZ CSV 로드</button>
        <label><span>손상된 HEX 앞부분 자동 복구(미리보기)</span><input id="recoverPartial" type="checkbox" checked></label>
      </div>
    </section>
    <section class="card">
      <div class="row">
        <label>모니터 저장 세션<select id="savedSession"></select></label>
        <label>장치<select id="savedDevice"></select></label>
        <label>센서
          <select id="savedSensor"><option>ADXL</option><option>PIEZO</option><option>초음파</option></select>
        </label>
        <label>g RMS Window
          <select id="rmsWindow">
            <option>전체</option><option>1024</option><option>2048</option><option>4096</option><option>8192</option>
          </select>
        </label>
        <button type="button" id="loadSaved">저장 CSV 불러오기</button>
        <button type="button" class="secondary" id="reloadSaved">목록 새로고침</button>
      </div>
      <div id="savedFiles" class="macs"></div>
      <p>센서 수신 모니터가 저장한 CSV입니다. 아래는 패킷이 쌓인 g RMS이고, 불러오기를 누르면 그 데이터로 MQTT 전송도 할 수 있습니다.</p>
    </section>
    <section class="card"><canvas id="trend" class="chart"></canvas></section>
    <section class="card">
      <div class="row">
        <label>그래프 센서
          <select id="sensor"><option>PIEZO</option><option>ADXL</option><option>초음파</option></select>
        </label>
        <button type="button" id="prev">이전 패킷</button>
        <button type="button" id="next">다음 패킷</button>
        <label>번호<input id="index" value="1" style="width:70px"></label>
        <button type="button" id="go">번호 이동</button>
        <span id="position">파일을 선택하세요</span>
        <button type="button" id="start">선택 위치부터 전송 시작</button>
        <button type="button" class="secondary" id="stop">중지</button>
        <span id="stats"></span>
      </div>
    </section>
    <section class="grid">
      <div class="card"><canvas id="raw" class="chart"></canvas></div>
      <div class="card"><canvas id="fft" class="chart"></canvas></div>
    </section>
    <section class="card"><pre id="log"></pre></section>
  </main>
  <script src="/static/generator.js"></script>
</body>
</html>
