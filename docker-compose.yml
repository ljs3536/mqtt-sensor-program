# 센서 웹 실행 파일. 접속: http://<서버 주소>:8090
# 이미지는 미리 만들어 둔 sensor-web:latest를 쓴다(여기서 빌드하지 않는다).
#
# 이미지 만들기(소스가 있는 PC):   docker build -t sensor-web:latest .
# 다른 PC로 옮기기:                python docker/make_bundle.py  → docker-bundle/ 폴더째 복사
# 옮긴 PC에서:                     docker load -i sensor-web.tar  →  docker compose up -d
# 자세한 순서: docs/Docker-AWS-배포.md "tar로 옮겨 설치하기"
#
# 이 파일 옆 폴더(없으면 자동으로 생기지만, Linux에서는 미리 만들고 권한을 주는 것이 안전하다):
#   ./data/       SQLite(sensor.sqlite), 평면도(site_files/), MEMS 보정 JSON
#   ./data_csv/   수신 CSV(YYYYMMDD_HHMMSS 폴더). 설정 화면 '수신 MQTT'에서 CSV 저장을 켜야 쌓인다.
#
# MQTT 브로커는 여기 넣지 않았다. 센서·게이트웨이가 쓰는 브로커 주소를 설정 화면 '수신 MQTT'에 넣는다.
# 컨테이너 안의 127.0.0.1은 컨테이너 자신이다. 같은 PC의 브로커는 host.docker.internal 로 적는다.
services:
  web:
    image: sensor-web:latest
    container_name: sensor-web
    restart: unless-stopped
    ports:
      # 바깥(서버 PC) 포트 : 컨테이너 안 포트. 안은 항상 8081(Dockerfile)이고 바깥만 바꾼다.
      # 기본 8090(AWS 보안 그룹에 열려 있는 포트). 바꾸려면 .env 에 WEB_PORT=원하는포트
      - "${WEB_PORT:-8090}:8081"
    volumes:
      # 컨테이너 /data = DB·평면도·보정 JSON (SENSOR_DATA_DIR, web_db/src/paths.py)
      - ./data:/data
      # CSV는 /data/data_csv에 쓰인다. 그 자리만 이 파일 옆 data_csv 폴더로 따로 연결한다.
      - ./data_csv:/data/data_csv
    extra_hosts:
      # Linux에서도 host.docker.internal 이 호스트 PC를 가리키게 한다(Windows·Mac은 기본 제공).
      - "host.docker.internal:host-gateway"
