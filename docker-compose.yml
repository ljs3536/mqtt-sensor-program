# 센서 웹. 서버에는 이 파일과 sensor-web.tar 두 개만 두면 된다.
#
#   docker load -i sensor-web.tar
#   docker compose up -d --force-recreate      → http://<서버 주소>:8060
# --force-recreate: 새 tar를 load 해도 이미지 이름(sensor-web:latest)이 같으면 떠 있는 컨테이너가
# 옛 이미지로 계속 돌 수 있다. 컨테이너를 새로 만들어 새 이미지를 확실히 쓰게 한다(데이터는 바깥 폴더라 그대로).
#
# 이 파일이 있는 폴더 기준으로 아래 두 폴더를 쓴다(로컬·개발 서버·운영 서버 모두 같은 이름).
#   ./data_csv_web/   수신 CSV(날짜_시각 폴더). 이미 있으면 그대로 읽고(설정 → 통계 데이터 → 'CSV로 시간별 통계'), 새 CSV도 여기에 쌓는다.
#   ./sensor_web_db/  DB(sensor.sqlite), 평면도 이미지, MEMS 보정 JSON. 처음이면 비어 있는 DB로 시작한다.
# 컨테이너는 ./data_csv_web 주인과 같은 사용자로 돈다(이미지 안 시작 스크립트). 폴더가 없으면 Docker가 root로 만든다.
#
# 이미지 만들기(소스 PC): python docker/make_bundle.py  → docker-bundle/ 에 sensor-web.tar 와 이 파일
# 포트를 바꾸려면 아래 "8060"만 고친다(컨테이너 안은 8081 고정). 8060 = 운영 서버 예전 웹과 같은 포트.
# MQTT 브로커 주소는 설정 화면 '수신 MQTT'에 넣는다. 같은 서버의 브로커면 host.docker.internal.
services:
  web:
    image: sensor-web:latest
    container_name: sensor-web
    restart: unless-stopped
    ports:
      - "8060:8081"
    volumes:
      - ./sensor_web_db:/data
      - ./data_csv_web:/data/data_csv_web
    extra_hosts:
      # Linux에서도 host.docker.internal 이 서버 PC를 가리키게 한다(Windows·Mac은 기본 제공).
      - "host.docker.internal:host-gateway"
